name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (if uploaded as zip)
        run: |
          if [ -f akhlaqiyat_flutter_project.zip ]; then unzip -q -o akhlaqiyat_flutter_project.zip; fi
          if [ -d akhlaqiyat_project ]; then echo "PROJECT_DIR=akhlaqiyat_project" >> $GITHUB_ENV; else echo "PROJECT_DIR=." >> $GITHUB_ENV; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold and set permissions
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash tool/prepare_android.sh

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash tool/build_apk.sh

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: akhlaqiyat-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: أخلاقيات APK #${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
