name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Unzip and locate project files
        run: |
          unzip -o akhlaqiyat_flutter_project.zip -d temp_folder
          PUB_DIR=$(dirname $(find temp_folder -name "pubspec.yaml" | head -n 1))
          cp -r $PUB_DIR/* .
          rm -rf temp_folder

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: akhlaqiyat-app
          path: build/app/outputs/flutter-apk/app-release.apk
          
